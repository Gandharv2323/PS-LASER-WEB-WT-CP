<text x="50" y="620" font-size="12.5" font-weight="400" fill="#1d1d1b" text-anchor="start">Process 2.1: schema validation (material code, numeric ranges, quantity >= 1, part inside the 3000 x 1500 mm bed).</text>
<text x="50" y="637" font-size="12.5" font-weight="400" fill="#1d1d1b" text-anchor="start">Process 2.2: SELECT the rate row whose thickness band contains thickness_mm; reject thickness above the material maximum or in a gap.</text>
<text x="50" y="654" font-size="12.5" font-weight="400" fill="#1d1d1b" text-anchor="start">Process 2.3: area = L x W / 1e6; weight = area x t x density; material, cutting, piercing, bending and coating lines.</text>
<text x="50" y="671" font-size="12.5" font-weight="400" fill="#1d1d1b" text-anchor="start">Process 2.4: each line rounded half-up to 2 dp; perPart = sum; subtotal = round2(perPart x qty); gst = round2(subtotal x g / 100).</text>
<text x="50" y="688" font-size="12.5" font-weight="400" fill="#1d1d1b" text-anchor="start">Process 2.5: build EstimateResult, set isSample from settings.rates_are_sample, publish EstimateCalculated.</text>
<text x="50" y="705" font-size="12.5" font-weight="400" fill="#1d1d1b" text-anchor="start">Process 2.6 runs only for POST /api/quotes (stores quote number PSL-Q-YYYYMMDD-####).</text>
<text x="50" y="722" font-size="12.5" font-weight="400" fill="#1d1d1b" text-anchor="start">Offline fallback: if Spring is unreachable, the Next.js route handler runs the same formula in TypeScript (source = offline).</text>
</svg>