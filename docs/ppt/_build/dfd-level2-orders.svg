<rect x="1180" y="520" width="680" height="330" rx="6" fill="#fffbe6" stroke="#c9b458"/>
<text x="1190" y="540" font-size="12.5" font-weight="400" fill="#1d1d1b" text-anchor="start">6.1 Spring Security filter verifies the HS256 JWT and the role (admin / staff).</text>
<text x="1190" y="557" font-size="12.5" font-weight="400" fill="#1d1d1b" text-anchor="start">6.2 JPA writes work_orders; 6.3 inserts a work_order_events row in the SAME</text>
<text x="1190" y="574" font-size="12.5" font-weight="400" fill="#1d1d1b" text-anchor="start">    @Transactional method as the status change.</text>
<text x="1190" y="591" font-size="12.5" font-weight="400" fill="#1d1d1b" text-anchor="start">6.4 WorkOrderStatusChanged is published with ApplicationEventPublisher and</text>
<text x="1190" y="608" font-size="12.5" font-weight="400" fill="#1d1d1b" text-anchor="start">    delivered only AFTER the transaction commits (no event for rolled-back data).</text>
<text x="1190" y="625" font-size="12.5" font-weight="400" fill="#1d1d1b" text-anchor="start">7.1 ActivityEventListener (async) stores the event in MongoDB.</text>
<text x="1190" y="642" font-size="12.5" font-weight="400" fill="#1d1d1b" text-anchor="start">7.2 The same listener sends the message to the STOMP simple broker; the Next.js</text>
<text x="1190" y="659" font-size="12.5" font-weight="400" fill="#1d1d1b" text-anchor="start">    dashboard subscribes (fallback: 15 s polling).</text>
<text x="1190" y="676" font-size="12.5" font-weight="400" fill="#1d1d1b" text-anchor="start">5.1-5.3 Customer tracking is a read-only path: both orderNo and phone must</text>
<text x="1190" y="693" font-size="12.5" font-weight="400" fill="#1d1d1b" text-anchor="start">    match, otherwise the response is 404 with no hint whether the order exists.</text>
